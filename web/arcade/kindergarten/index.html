<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星屿学园 · 幼儿园小岛</title><link rel="stylesheet" href="./style.css"><script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script></head><body>
<header><button id="home" class="icon-button" aria-label="返回主游戏首页"></button><div id="stars" aria-label="探索星星"></div><div class="header-right"><button id="sound" class="icon-button" aria-label="关闭声音" aria-pressed="true"></button><button id="pause" class="icon-button" aria-label="暂停"></button><button id="parent" aria-label="家长说明">家长</button></div></header>
<main><section id="hub" aria-label="幼儿园游戏选择"><div class="hub-toys"><button data-kind="feed" aria-label="喂小兔子，数一数"><span class="island-toy" id="feed-preview"></span></button><button data-kind="sort" aria-label="水果找家，分一分"><span class="island-toy" id="sort-preview"></span></button><button data-kind="build" aria-label="照样子搭积木"><span class="island-toy" id="build-preview"></span></button></div><div class="hub-sparkles" aria-hidden="true">✦　✧　✦</div></section>
<section id="play" hidden aria-label="动手游戏"><div id="board"><div id="goal" aria-label="看图样例"></div><div id="targets"></div><div id="tray" aria-label="可以移动的玩具"></div><div id="fx" aria-hidden="true"></div><div id="demonstration" hidden aria-hidden="true"><div id="demo-item"></div><div id="demo-hand"></div></div></div><nav id="assist" aria-label="帮助"><button id="show" class="icon-button" aria-label="看小手演示"></button><button id="listen" class="icon-button" aria-label="再听一次"></button><button id="reset" class="icon-button" aria-label="再玩一次"></button></nav></section>
<div id="companion" aria-label="星宝陪你玩"><canvas id="xingbao" aria-hidden="true"></canvas><div id="portrait-fallback" hidden aria-hidden="true">✦</div><span class="speech-waves" aria-hidden="true">♪</span></div>
<div id="celebrate" hidden><div class="reward-stars" aria-hidden="true"></div><button id="next" class="icon-button" aria-label="玩下一关"></button></div>
<div id="paused" hidden><div class="pause-card"><div id="pause-symbol" aria-hidden="true"></div><button id="resume" class="icon-button" aria-label="继续玩"></button></div></div>
</main>
<dialog id="parent-dialog"><h2>幼儿园小岛 · 家长说明</h2><p>孩子不用识字：先看实物样例和小手示范，再听星宝短语音。可以拖动，也可以先点玩具、再点目标。</p><ul><li>喂小兔子：把图片数量与实际物品一一对应（2—4 个）。</li><li>水果找家：按水果的形状和颜色匹配，最多三种。</li><li>搭积木：观察样例，从下往上匹配形状。</li></ul><p>没有倒计时、扣分和失败惩罚。放错轻轻归位。静音后仍有图案与示范。建议亲子共同体验，孩子想休息时随时退出。</p><p id="voice-status">语音使用与主游戏一致的星宝合成声音。首次点玩具后开始播放。</p><p id="save-note">星星只保存在当前设备，不计入小学课程积分。</p><div class="parent-actions"><button id="exit">返回原游戏</button><button id="close-parent">回到孩子的游戏</button></div></dialog>
<div id="status" role="status" aria-live="polite" class="sr-only"></div><script src="../vendor/matter.min.js"></script><script type="module" src="./app.js"></script></body></html>
